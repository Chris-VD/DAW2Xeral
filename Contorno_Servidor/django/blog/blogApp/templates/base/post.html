{%load static%}
{%block content%}
<ul>
    {%for post in posts%}
        <li>
            <img src="{{post.image.url}}" style="width:50px" alt="{{post.title}}"><br> 
            <a href="/{{post.id}}">{{post}}</a>
            <p>{{post.excerpt}}, {{post.date|date:"d \o\f M - Y"}}</p>
        </li>
    {%endfor%}
</ul>
{%endblock%}
