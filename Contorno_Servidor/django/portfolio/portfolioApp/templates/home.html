{%load static%}
<h1>Home page</h1>
<img src="{%static 'portfolio/wallhaven-3l33xy.jpg'%}"/>

{%for project in projects%}
    {%if project.url%}
        <a href="{{project.url}}"><h2>{{project.title}}</h2></a>
    {%else%}
        <h2>{{project.title}}</h2>
    {%endif%}
    <p>{{project.description}}</p>
    <img src="{{project.image.url}}" alt="{{project.title}}" />
{%endfor%}
