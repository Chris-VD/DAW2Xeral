<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link href="../css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>

<body>

    <button class="btn">btn</button>
    <button class="btn btn-primary">primary</button>
    <button class="btn btn-sm btn-secondary">secondary</button>
    <button class="btn btn-md btn-success">success</button>
    <button class="btn btn-lg btn-danger">danger</button>
    <button class="btn btn-warning">warning</button>
    <button class="btn btn-light">light</button>
    <button class="btn btn-light btn-outline-dark">light</button>
    <button class="btn btn-dark">dark</button>
    <button class="btn btn-dark btn-outline-danger">dark</button>
    <button class="btn btn-link">link</button>
    <button class="btn btn-link btn-outline-danger">link</button>

    <div class="alert alert-danger">danger</div>
    <div class="alert alert-warning">warning</div>
    <div class="alert alert-info">info</div>

    <div class="btn-group">
        <button class="btn btn-danger btn-outline-dark">dark</button>
        <button class="btn btn-success btn-outline-light">light</button>
        <button class="btn btn-primary btn-outline-danger">danger</button>
    </div>

    <button class="btn btn-danger btn-outline-dark">danger
        <span class="badge badge-primary">4</span>
    </button>

    <ul class="list-group">
        <li class="list-group-item active">An item</li>
        <li class="list-group-item">A second item</li>
        <li class="list-group-item">A third item</li>
        <li class="list-group-item active">A fourth item</li>
        <li class="list-group-item">And a fifth one</li>
    </ul>

    <script src="../js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
