<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>

  <body>
    <h1>Ex4</h1>
    <div class="container">
      <div class="row">
        <div class="col-md bg-secondary text-white border text-center">Header</div>
      </div>
      <div class="row">
        <div class="col-3 bg-primary text-white border text-center">Nav</div>
        <div class="col-sm">
            <div class="row">
                <div class="col-md bg-warning text-white border text-center">Section A</div>
            </div>
            <div class="row">
                <div class="col-6 bg-danger text-white border text-center">Section B</div>
                <div class="col-6 bg-danger text-white border text-center">Section C</div>
            </div>
            <div class="row">
                <div class="col-md-3 bg-success text-white border text-center">Section 1</div>
                <div class="col-md-3 bg-success text-white border text-center">Section 2</div>
                <div class="col-md-3 bg-success text-white border text-center">Section 3</div>
                <div class="col-md-3 bg-success text-white border text-center">Section 4</div>
            </div>
        </div>
      </div>
      <div class="row">
        <div class="col-md bg-info text-white border text-center">Footer</div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
