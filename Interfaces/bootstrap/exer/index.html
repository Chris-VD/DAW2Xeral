<body>
    <h1>Ex1</h1>
    <div class="container text-white text-center">
        <div class="row">
            <div class="col bg-success border border-white">Header</div>
        </div>
        <div class="row">
            <div class="col-sm-4 bg-info border border-white offset-md-2 offset-sm-4">Info 1</div>
            <div class="col-sm-4 bg-info border border-white ">Info 2</div>
        </div>
        <div class="row">
            <div class="col-md-10 bg-secondary border border-white offset-md-1">Section</div>
        </div>
        <div class="row">
            <div class="col-sm-4 bg-info border border-white">Info 3</div>
            <div class="col-sm-4 bg-info border border-white offset-md-4">Info 4</div>
        </div>
        <div class="row">
            <div class="col bg-danger border border-white d-none d-md-block">Exclusive computer</div>
        </div>
        <div class="row">
            <div class="col bg-danger border border-white d-sm-none">Exclusive mobile</div>
        </div>
        <div class="row">
            <div class="col bg-primary border order-sm-4 order-md-2 border-white">1</div>

            <div class="col bg-primary border order-md-4 border-white">3</div>
            <div class="col bg-primary border order-sm-1 order-md-3 border-white">4</div>
        </div>
        <div class="row row-cols-2 row-cols-sm-3 row-cols-md-5">
            <div class="col bg-info border border-white">1</div>
            <div class="col bg-info border border-white">2</div>
            <div class="col bg-info border border-white">3</div>
            <div class="col bg-info border border-white">4</div>
            <div class="col bg-info border border-white">5</div>
        </div>
        <div class="row">
            <div class="col bg-success border border-white">Footer</div>
        </div>
    </div><br>

    <h1>Ex2</h1>
    <div class="container">
        <div class="row">
            <div class="col border border-black">
                <h1>Header</h1>
            </div>
        </div>
        <div class="row border border-black mt-1 text-center">
            <div class="col-sm">Inicio</div>
            <div class="col-sm offset-sm-2">Quienes somos?</div>
            <div class="col-sm offset-sm-2">Servizos</div>
            <div class="col-sm offset-sm-2">Contacto</div>
        </div>
        <div class="row mt-1">
            <div class="col border border-black order-sm-1">
                <div class="row">
                    <div class="col border border-black m-1">
                        <h1>Card 1</h1>
                        <p>Contido card 1</p>
                    </div>
                    <div class="col border border-black m-1">
                        <h1>Card 2</h1>
                        <p>Contido card 2</p>
                    </div>
                    <div class="col border border-black m-1">
                        <h1>Card 3</h1>
                        <p>Contido card 3</p>
                    </div>
                    <div class="col border border-black m-1">
                        <h1>Card 4</h1>
                        <p>Contido card 4</p>
                    </div>
                </div>
            </div>
            <div class="col-sm-3 border border-black me-1" style="height: 400px;">
                <h1>Aside</h1>
                <p>Contido do aside</p>
            </div>
        </div>
        <div class="row mt-1">
            <div class="col border border-black"><b>Footer</b></div>
        </div>
    </div>
