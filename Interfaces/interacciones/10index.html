<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10</title>
    <style>
        .red{
            background-color: red;
        }
    </style>
</head>
<body>
    <div>
        <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Rem ipsa obcaecati aliquid, corporis impedit totam incidunt non consequatur error accusantium?
        </p>
        <button id="btn">likes</button>
    </div>
    <script defer>
        const btn = document.querySelector('button');
        btn.addEventListener("click", addlike)
        let likes = 0;
        function addlike(){
            likes++
            btn.innerText = "likes " + likes
            if (likes >= 10){
                btn.classList.add("red")
            }
        }
    </script>
</body>
</html>
