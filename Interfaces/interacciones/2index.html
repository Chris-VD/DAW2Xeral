<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
    <style>
        div{
            width: 600px;
            height: 160px;
        }
        div:hover{
            transform: 0.2s;
            img{
                opacity: 60%;
            }
            img:hover{
                opacity: 100%;
                transition: 0.2s;
                transform: scale(1.1) rotate(3deg);
            }
        }
        img{
            width: 200px;
        }
        
    </style>
</head>
<body>
    <div>
        <img src="img/img.jpg" alt=""><img src="img/img.jpg" alt=""><img src="img/img.jpg" alt="">
    </div>
</body>
</html>
