<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6</title>
    <style>
        label {
            transform: translateY(50%);
            position: absolute;
        }
        input:focus{
            span{
                
                transform: translateY(-100%);
            }
        }
        span {
            position: absolute;
            left: 10px;
            transition-duration: 300ms;
        }
    </style>
</head>

<body>

    <label for="text">
        <span>Label</span>
        <input type="text" name="text" id="text">
    </label>
</body>

</html>
