<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7</title>
    <style>
        img{
            z-index: 1;
            margin-top: 0px;
            height: 300px;
        }
        #main{
            position: relative;
            height: 300px;
            width: fit-content;
            overflow: hidden;
        }
        #text{
            opacity: 0.8;
            z-index: 2;
            position: absolute;
            top: 300px;
            background-color: black;
            color: white;
            height: 300px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            
            /* display: none; */
            transition: 2s;
        }
        #main:hover > #text{
            /* top: 50%; */
            top: 0px;
            display: flex;
        }
    </style>
</head>
<body>
    <div id="main">
        <img src="img/img.jpg" alt="img">
        <div id="text">
            <h4>Title</h4>
            <p>text</p>
        </div>
    </div>
</body>
</html>
