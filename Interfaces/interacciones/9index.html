<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9</title>
    <style>
        div{
            width: 200px;
            position: relative
            
        }
        img{
            width: 200px;
            height: auto;
            transition: 1s;
        }
        div:hover{
            img{
                transform: rotateY(90deg);
            }
        }
        div:hover > p{
            animation-name: text;
            animation-duration: 2s;
            animation-fill-mode: forwards;
            animation-direction: alternate;
        }
        @keyframes text {
            0%{
                transform: rotateY(270deg);
            }
            50%{
                transform: rotateY(270deg);
                display: block;
            }
            100%{
                transform: rotateY(360deg);
            }
        }
        p{
            top: 0px;
            height: 100%;
            position: absolute;
            /* display: none; */
            width: 200px;
            background-color: aqua;
            transform: rotateY(270deg);
        }
        
    </style>
</head>
<body>
    <div>
    <img src="img/img.jpg" alt="img">
    <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Voluptates consequatur provident nesciunt ipsam laboriosam quas corrupti quidem earum ea aliquam.
    </p>
    </div>
</body>
</html>
