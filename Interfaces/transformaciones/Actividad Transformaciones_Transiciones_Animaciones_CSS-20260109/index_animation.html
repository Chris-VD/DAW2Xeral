<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #pulse{
            margin: 50px;
            border-radius: 100%;
            background-color: blue;
            width: 300px;
            height: 300px;
            
        }
        #pulse:hover{
            animation-name: circulo;
            animation-duration: 0.5s;
            position: relative;
            animation-iteration-count: infinite;
            animation-fill-mode: both;
            animation-timing-function: ease;
        }

        @keyframes circulo {
            from {
                width: 300px;
                height: 300px;
            }

            50% {
                width: 250px;
                height: 250px;
                
            }

            to {
                width: 300px;
                height: 300px;
                background-color: green;
            }
        }

        #movingSquare{
            margin: 50px;
            background-color: red;
            border: 3px solid brown;
            width: 250px;
            height: 250px;
            animation-name: cadrado;
            position: relative;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-fill-mode:forwards;
        }

        @keyframes cadrado{
            from {
                left: 0px;
                top: 0px;
            }
            33% {
                /* left: random(0px,500px);
                top: random(0px,500px); */
                top:250px;
                left:100px;
                width: 200px;
            }
            66% {
                left: 250px;
                top: 100px;
                height: 200px;
            }
            to{
                top:0;left:0;
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="pulse"></div>
        <div id="movingSquare"></div>
    </div>
</body>
</html>
